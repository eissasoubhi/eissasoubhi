<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="theme-color" content="#0b1220">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/images/profile.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="icon" href="{{ site.baseurl }}/images/favicons/favicon-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/portfolio.css?{{ site.time | date: '%s' }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Eissa Soubhi",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "image": "{{ site.url }}{{ site.baseurl }}/images/profile.jpg",
    "jobTitle": "Senior Full-Stack Engineer / Tech Lead",
    "email": "mailto:{{ site.author.email }}",
    "sameAs": [
      "https://github.com/{{ site.author.github_username }}",
      "https://www.linkedin.com/in/{{ site.author.linkedin_username }}"
    ],
    "knowsAbout": ["PHP", "Symfony", "TypeScript", "React", "Next.js", "Vue", "Nuxt", "Software Architecture", "CI/CD"]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ content }}
</body>
</html>
