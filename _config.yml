# Site settings
title: Aissa SOUBHI
description: 'Senior Full-Stack Engineer · PHP, Symfony, TypeScript, React, Next.js, Vue and Nuxt · 11+ years building and modernizing production web platforms.'
url: 'https://eissasoubhi.github.io'
baseurl: '/eissasoubhi'
lang: en
social_image: '/images/portfolio-social.png'

author:
  name: 'Aissa SOUBHI'
  email: eissa.soubhi@gmail.com
  github_username: eissasoubhi
  linkedin_username: aissa-soubhi

defaults:
  -
    scope:
      path: ''
      type: 'posts'
    values:
        layout: 'post'

# Build settings
destination: _site
paginate: 10
permalink: /:year/:title/
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  input: GFM
  hard_wrap: false

plugins: ['jekyll-paginate']
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'screenshot.png']
