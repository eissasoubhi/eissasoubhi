# Site settings
title: Eissa Soubhi
description: 'Senior Full-Stack Engineer / Tech Lead · PHP, Symfony, TypeScript, React, Next.js, Vue and Nuxt · 11+ years building production web platforms.'
url: 'https://eissasoubhi.github.io'
baseurl: '/eissasoubhi'

author:
  name: 'Eissa Soubhi'
  email: eissa.soubhi@gmail.com
  twitter_username: eissa_soubhi
  github_username: eissasoubhi
  linkedin_username: aissa-soubhi
  skype_username: eissa.soubhi

defaults:
  -
    scope:
      path: ''
      type: 'posts'
    values:
        layout: 'post'

# Build settings
destination: _site
paginate: 10
permalink: /:year/:title/
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  input: GFM
  hard_wrap: false

plugins: ['jekyll-paginate']
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'screenshot.png']
